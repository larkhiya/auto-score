# Auto-Score stack. Containers reach each other by service name (n8n, crm, llm-proxy, greenmail), never localhost.
# Values come from .env (run `npm run init-env` first).
name: auto-score

services:
  n8n:
    # Pinned (D-006). 2.43.7 = the `stable` tag on 2026-10-16.
    image: docker.n8n.io/n8nio/n8n:2.43.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run npm run init-env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      TZ: ${GENERIC_TIMEZONE:-Etc/UTC}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  crm:
    # Mock CRM (Phase 2): REST API, webhooks to n8n, HTML pages, failure simulation.
    build:
      context: .
      dockerfile: crm/Dockerfile
    image: auto-score-crm:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CRM_PORT: "3000"
      CRM_API_KEY: ${CRM_API_KEY:?run npm run init-env}
      CRM_WEBHOOK_SECRET: ${CRM_WEBHOOK_SECRET:?run npm run init-env}
      CRM_WEBHOOK_URL_APPLICATION: ${CRM_WEBHOOK_URL_APPLICATION:-http://n8n:5678/webhook/application-received}
      CRM_WEBHOOK_URL_JOB: ${CRM_WEBHOOK_URL_JOB:-http://n8n:5678/webhook/job-draft-requested}
      FAIL_RATE: ${FAIL_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
    volumes:
      - crm_data:/app/crm/data

  llm-proxy:
    # Between WF-12 and Gemini (D-031): forwards every call; faults armed at runtime via /admin/chaos.
    # Bound to 127.0.0.1 so only this machine can reach the admin endpoint from outside Docker.
    build:
      context: .
      dockerfile: llm-proxy/Dockerfile
    image: auto-score-llm-proxy:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      LLM_PROXY_PORT: "8090"
      LLM_UPSTREAM: https://generativelanguage.googleapis.com
      LLM_PROXY_ADMIN_KEY: ${LLM_PROXY_ADMIN_KEY:?run npm run init-env}

  greenmail:
    # Local test mail server (D-011): SMTP 3025, IMAP 3143. Test data only.
    image: greenmail/standalone:2.1.14
    restart: unless-stopped
    ports:
      - "3025:3025"
      - "3143:3143"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users.login=email
        -Dgreenmail.users=applications:${MAIL_PASSWORD:?run npm run init-env}@autoscore.test

volumes:
  n8n_data:
  crm_data:
